[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "2005Andrei", email = "ascurtuny@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langgraph>=1.2.22",
    "lxml>=6.1.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.3",
    "redis>=5.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
