# Redis for local development.
# Holds: the arq job queue, run metadata and the per-run event streams.

bind 0.0.0.0
port 6379
# Dev only: compose publishes this port on localhost with no password.
protected-mode no

# Survive container restarts: append-only file, fsync once per second.
appendonly yes
appendfsync everysec
dir /data

# Never evict silently: losing a queued job or half an event stream is worse
# than an error. Run keys expire on their own (RUN_TTL_SECONDS).
maxmemory 256mb
maxmemory-policy noeviction
